name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/
      - name: Mypy
        run: mypy src/parallel_os || true   # don't fail CI yet — pre-alpha

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest tests/ -v || true   # tests will land with v0.0.2

  validate-runtime-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tools.json files
        run: |
          for f in runtimes/*/tools.json; do
            echo "Validating $f"
            python -c "import json; json.load(open('$f'))"
          done
