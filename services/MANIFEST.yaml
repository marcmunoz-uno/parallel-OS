# parallel-OS service manifest
#
# Each entry describes a runtime/service that an AI agent can call from this host.
# The agent reads this file (directly or through `parallel_os.services.load()`) to
# discover what's available, where to authenticate, and where the per-service
# agent contract lives.
#
# Conventions:
#   - host        : where the service binds. Always 127.0.0.1 unless explicitly fronted.
#   - auth        : "bearer" | "none" | "<custom>"
#   - token_file  : absolute path on the host where the bearer token lives (chmod 0600)
#   - agent_doc   : path (relative to repo root) to the agent-facing usage guide
#   - openapi     : path / URL to the OpenAPI spec, if served
#   - mcp         : how the agent reaches this service over MCP (stdio command or socket)

version: 1

services:

  - name: kali-factory
    role: osint-and-recon
    status: pre-alpha
    repo: https://github.com/marcmunoz-uno/Kali-Factory-Instructions
    submodule_path: services/kali-factory
    description: |
      Host-local control plane that gives agents bounded, allowlisted access to
      Kali Linux OSINT tooling. Typed jobs only — no shell. Three-layer
      allowlist (Pydantic / policy module / Dockerfile). Ephemeral hardened
      Docker containers per job.
    api:
      host: 127.0.0.1
      port: 8081
      base_url: http://127.0.0.1:8081
      auth: bearer
      token_file: ${KALI_FACTORY_API_TOKEN_FILE:-./services/kali-factory/.secrets/api_token}
      health: GET /health
      tools_endpoint: GET /tools
      submit_endpoint: POST /jobs
      poll_endpoint: GET /jobs/{job_id}
    mcp:
      transport: stdio
      command: ./services/kali-factory/scripts/start-mcp.sh
    jobs:
      - kali_probe
      - subdomain_enum
      - web_fingerprint
      - leak_scan
      - nuclei_exposures
      - traffic_capture       # stub in v0.0.2
      - osint_run             # stub in v0.0.2 — generic dispatch over the ~80-tool allowlist
    # Source of truth: services/kali-factory/runtimes/kali/tools.json
    # `shell_blocklist` and src/kali_factory/policy/allowlist.py BLOCKED_TOOLS.
    # Categories below — see the full list in the kali-factory repo.
    forbidden:
      tools:
        # exploit / payload frameworks
        - metasploit
        - msfvenom
        - msfconsole
        - sqlmap
        - commix
        - xsser
        - xsstrike
        - weevely
        - beef
        - setoolkit
        # credential cracking
        - hashcat
        - john
        - hydra
        - medusa
        - ncrack
        - patator
        - kerbrute
        # wireless attacks
        - aircrack-ng
        - airmon-ng
        - airodump-ng
        - kismet
        - reaver
        - wifite
        # active MITM / network spoofing
        - ettercap
        - bettercap
        - mitm6
        - dsniff
        - dnschef
        - dnsspoof
        - arpspoof
        - macchanger
        # noisy web vuln scanners
        - nikto
        - wpscan
        # post-exploitation / AD
        - responder
        - crackmapexec
        - nxc
        - evil-winrm
        - bloodhound
        - impacket-secretsdump
        - impacket-psexec
        - impacket-wmiexec
        - impacket-smbexec
        # exploit databases
        - exploitdb
        - searchsploit
        # router exploits
        - routersploit
        # C2 frameworks
        - empire
        - covenant
        - mythic
        - pupy
        # payload generators
        - thefatrat
        - veil
        # tunneling / pivoting (offensive context)
        - chisel
        - ligolo-ng
        - gost
        # misc offensive
        - thc-ipv6
      nuclei_template_dirs:
        - cves/
        - vulnerabilities/
        - default-logins/
        - fuzzing/
        - exploits/
        - network/
    agent_doc: services/kali-factory/START_HERE_FOR_AGENTS.md
    deployment_doc: services/kali-factory/DEPLOYMENT.md

  # GPU Factory is a sibling service that lives in its own repo. It is not
  # vendored here as a submodule because parallel-OS's compute story is
  # orthogonal (CUDA / inference) — but agents discover it through the same
  # manifest pattern and call it the same way.
  - name: gpu-factory
    role: cuda-and-inference
    status: external
    repo: https://github.com/marcmunoz-uno/GPU-Factory-Instructions
    submodule_path: null
    description: |
      Host-local control plane that distributes GPU/CUDA access on the DGX
      Spark. Same pattern as kali-factory (typed jobs, bearer auth, RQ worker)
      but the runtime is CUDA tooling instead of OSINT.
    api:
      host: 127.0.0.1
      port: 8080
      base_url: http://127.0.0.1:8080
      auth: bearer
      token_file: ${GPU_FACTORY_API_TOKEN_FILE:-/etc/gpu-factory/api_token}
      health: GET /health
    agent_doc: null   # see the GPU Factory repo's own agent guide

  # Python-ML runtime lives in-tree at runtimes/python-ml/. It does not yet
  # have a wrapping service (FastAPI/RQ/bearer-auth/MCP) — agents call it
  # by spawning the image directly through Docker until the service shape
  # is wired. When that happens this entry will gain an `api:` block and
  # likely a submodule_path for a Python-ML-Factory-Instructions repo.
  - name: python-ml
    role: data-science-and-ml
    status: image-only
    repo: null
    submodule_path: null
    runtime_image: python-ml/data:latest
    runtime_dockerfile: runtimes/python-ml/Dockerfile
    description: |
      Sandboxed Python 3.12 with the standard scientific/ML stack — numpy,
      pandas, scipy, scikit-learn, torch (CPU), transformers, sentence-
      transformers, polars, duckdb, xgboost, lightgbm, faiss-cpu, plus
      visualization (matplotlib/seaborn/plotly) and Jupyter. Unit of work
      is Python code; the container is the security boundary.
    libraries:
      numerics: [numpy, scipy, sympy]
      dataframes: [pandas, polars, pyarrow, duckdb]
      classical_ml: [scikit-learn, xgboost, lightgbm, statsmodels]
      deep_learning: [torch, torchvision]
      nlp_and_embeddings: [transformers, sentence-transformers, tokenizers, safetensors, datasets]
      vector_stores: [faiss-cpu, chromadb-client]
      viz: [matplotlib, seaborn, plotly]
    container_constraints:
      user: "65534:nogroup"
      cap_drop: [ALL]
      read_only_rootfs: true
      tmpfs: [/tmp, /work]
      no_host_volumes_default: true
      network: egress-allowed
      default_memory_limit_gb: 8
      default_cpu_limit: 4
      default_max_runtime_sec: 1800
    planned_jobs:
      - python_run         # arbitrary script execution in sandbox
      - embed              # sentence-transformers embeddings
      - dataframe_op       # declarative pandas/polars chain
      - train_sklearn      # fit estimator, persist artifact, return metrics
      - predict            # load artifact, run inference
    agent_doc: runtimes/python-ml/README.md
