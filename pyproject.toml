[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-os"
version = "0.0.4"
description = "Multi-OS execution framework for AI agents — spawn any operating system as an MCP-wrapped runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "marcmunoz-uno"}]
keywords = ["ai-agents", "mcp", "docker", "multi-os", "agent-framework", "kali", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "docker>=7.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "anyio>=4.0",
    "structlog>=24.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
parallel-os = "parallel_os.cli:main"

[project.urls]
Homepage = "https://github.com/marcmunoz-uno/parallel-OS"
Issues = "https://github.com/marcmunoz-uno/parallel-OS/issues"
Architecture = "https://github.com/marcmunoz-uno/parallel-OS/blob/main/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
